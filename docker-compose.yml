# Local development stack (plan Section 25).
# Services: postgres, backend (FastAPI + AI Worker + MCP servers), frontend (Next.js).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://support:support@postgres:5432/support
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      # Next dev proxy: point /api/* at the backend service (not localhost,
      # which would be this container) — required for the UI->backend calls.
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
